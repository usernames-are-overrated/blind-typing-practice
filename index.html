<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Typing Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-left">
                <h1>Blind Typing Practice</h1>
                <div class="skill-indicator">
                    <span id="skillLevel">0</span>
                    <div class="skill-bar">
                        <div id="skillProgress" class="skill-progress"></div>
                    </div>
                </div>
            </div>
            <button id="settingsBtn" class="settings-icon-btn" aria-label="Settings">⚙️</button>
        </header>

        <!-- Settings backdrop -->
        <div id="settingsBackdrop" class="settings-backdrop"></div>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="settings-panel">
            <button id="closeSettings" class="close-btn">&times;</button>
            <h2>Settings</h2>

            <div class="setting-group">
                <label for="keyboardLayout">Keyboard Layout:</label>
                <select id="keyboardLayout">
                    <option value="qwerty">QWERTY</option>
                    <option value="qwerty-swedish">QWERTY (Swedish)</option>
                    <option value="dvorak">Dvorak</option>
                    <option value="colemak">Colemak</option>
                    <option value="azerty">AZERTY</option>
                    <option value="qwertz">QWERTZ</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="language">Language:</label>
                <select id="language">
                    <option value="english">English</option>
                    <option value="spanish">Spanish</option>
                    <option value="french">French</option>
                    <option value="german">German</option>
                    <option value="italian">Italian</option>
                    <option value="portuguese">Portuguese</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="rust">Rust</option>
                    <option value="go">Go</option>
                    <option value="typescript">TypeScript</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="contentType">Practice Content:</label>
                <select id="contentType">
                    <option value="mixed">Mixed (Variety)</option>
                    <option value="typing-tips">Typing Tips</option>
                    <option value="lorem-ipsum">Lorem Ipsum</option>
                    <option value="literature">Literature & Stories</option>
                    <option value="quotes">Famous Quotes</option>
                    <option value="conversation">Conversations</option>
                    <option value="facts">Interesting Facts</option>
                </select>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="includeSpecialKeys" checked>
                    Include Special Keys (Ctrl, Alt, Shift, Enter, Tab)
                </label>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="showTips" checked>
                    Show Tips and Instructions
                </label>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="enableBreaks" checked>
                    Enable Micro Breaks (RSI Prevention)
                </label>
            </div>

            <div class="setting-group">
                <label for="breakInterval">Break Interval (minutes):</label>
                <input type="number" id="breakInterval" min="5" max="60" value="15">
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="darkMode">
                    Dark Mode
                </label>
            </div>

            <div class="setting-group">
                <label>Color Scheme:</label>
                <div class="color-picker-group">
                    <div>
                        <label for="primaryColor">Primary:</label>
                        <input type="color" id="primaryColor" value="#4A90E2">
                    </div>
                    <div>
                        <label for="secondaryColor">Secondary:</label>
                        <input type="color" id="secondaryColor" value="#50C878">
                    </div>
                </div>
            </div>

            <button id="resetSettings" class="btn-secondary">Reset to Defaults</button>
        </div>

        <!-- Main Content -->
        <main id="mainContent">
            <!-- Tips Section -->
            <div id="tipsSection" class="tips-section">
                <h3>Typing Tips</h3>
                <ul id="tipsList"></ul>
            </div>

            <!-- Practice Area -->
            <div id="practiceArea" class="practice-area">
                <div id="targetText" class="target-text"></div>
                <div id="inputArea" class="input-area">
                    <input type="text" id="typingInput" placeholder="Start typing..." autocomplete="off" spellcheck="false">
                </div>
                <div id="specialKeyPrompt" class="special-key-prompt"></div>
                <div class="practice-stats">
                    <div class="stat">
                        <span class="stat-label">WPM:</span>
                        <span id="wpm">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Accuracy:</span>
                        <span id="accuracy">100%</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Time:</span>
                        <span id="timer">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Break Screen -->
            <div id="breakScreen" class="break-screen hidden">
                <div class="break-content">
                    <h2>Time for a Micro Break!</h2>
                    <p>Take a moment to rest your hands and eyes.</p>
                    <div id="breakTimer" class="break-timer">30</div>
                    <p class="break-tip" id="breakTip"></p>
                    <button id="skipBreak" class="btn-secondary">Skip Break</button>
                </div>
            </div>

            <!-- Celebration Overlay -->
            <div id="celebrationOverlay" class="celebration-overlay hidden">
                <div class="celebration-content">
                    <h2 id="celebrationTitle"></h2>
                    <p id="celebrationMessage"></p>
                    <button id="closeCelebration" class="btn-primary">Continue</button>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="resetBtn" class="btn-secondary">Reset</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
